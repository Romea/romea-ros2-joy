type: any_keyboard
joy_msg_layout:
  buttons:
    mapping:
      key_e: 0
      key_f: 1
      key_d: 2
      key_r: 3
      key_c: 4
      key_v: 5
  axes:
    arrows:
      mapping:
        up_down: 0
        left_right: 1
        up_down_inverse: 2
        left_right_inverse: 3
        home_end: 4
      scale: [-1.0, 1.0]
